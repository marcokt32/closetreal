# Nginx na frente da loja (VPS).
# 1) Troque SEU_DOMINIO.com.br pelo seu domínio.
# 2) sudo cp deploy/nginx-closetreal.conf /etc/nginx/sites-available/closetreal
#    sudo ln -s /etc/nginx/sites-available/closetreal /etc/nginx/sites-enabled/closetreal
#    sudo nginx -t && sudo systemctl reload nginx
# 3) sudo certbot --nginx -d SEU_DOMINIO.com.br -d www.SEU_DOMINIO.com.br
#    (o certbot acrescenta o HTTPS e o redirecionamento sozinho)

server {
    listen 80;
    listen [::]:80;
    server_name SEU_DOMINIO.com.br www.SEU_DOMINIO.com.br;

    # fotos enviadas pelo painel chegam como texto (base64): até ~8 MB por foto
    client_max_body_size 10m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 60s;
    }
}
